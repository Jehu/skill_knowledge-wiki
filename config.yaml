# Wiki Query — Hybrid GraphRAG for personal knowledge bases

# LLM configuration.
# Defaults stay local: provider is omitted for backward compatibility and
# resolves to Ollama.
llm:
  model: gemma4:e4b
  host: http://localhost:11434
  temperature: 0.3
  num_predict: 8192
  num_ctx: 65536
  timeout: 180

# Optional per-workflow overrides. Remote providers are opt-in per profile.
# A provider-changing profile must set its own model and reads credentials only
# from the named environment variable.
#
# llm_profiles:
#   query:
#     provider: openrouter
#     model: openai/gpt-4.1-mini
#     api_key_env: OPENROUTER_API_KEY
#   ingest:
#     temperature: 0.1

llm_profiles:
  query:
    provider: openrouter
    model: openai/gpt-oss-120b
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.3
    num_predict: 8192

# Sentence embedding configuration
embeddings:
  model: all-MiniLM-L6-v2
  threshold: 0.5

# Path to your knowledge wiki root directory.
# Can also be set via WIKI_ROOT environment variable.
# Priority: env WIKI_ROOT > config wiki_root > ~/knowledge
wiki_root: "~/knowledge"

# Ingest configuration (for auto_ingest.py)
ingest:
  feeds_config: config/feeds.yaml
  relevance_model: gemma4:e4b
